name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y sshpass

      - name: Sync built frontend to web root
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -az --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            --exclude ".htaccess" --exclude "api" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.PUBLIC_HTML_PATH }}/"

      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            WEB_ROOT="${{ secrets.PUBLIC_HTML_PATH }}"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f "$WEB_ROOT/.htaccess" ]; then
            write_htaccess() { cat > "$WEB_ROOT/.htaccess"; }
            write_htaccess <<'HTACCESS'
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_URI} ^/api [NC]
            RewriteRule ^ - [L]
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            RewriteRule ^ index.html [L]
            HTACCESS
            fi

            cd "$APP_DIR/backend"

            PHP_BIN=""
            for candidate in php8.4 php8.3 php8.2 lsphp84 lsphp83 lsphp82; do
              if command -v "$candidate" >/dev/null 2>&1; then
                PHP_BIN="$(command -v "$candidate")"
                break
              fi
            done

            if [ -z "$PHP_BIN" ]; then
              CANDIDATES=$(
                for root in /opt /usr/local /usr/local/lsws "$HOME"; do
                  find "$root" -maxdepth 6 -type f -iname 'php8.*' 2>/dev/null
                  find "$root" -maxdepth 6 -type f -iname 'lsphp8*' 2>/dev/null
                done
              )
              for f in $CANDIDATES; do
                [ -x "$f" ] || continue
                v=$("$f" -r 'echo PHP_VERSION;' 2>/dev/null) || continue
                case "$v" in
                  8.2*) PHP_BIN="$f" ;;
                  8.3*) PHP_BIN="$f" ;;
                  8.4*) PHP_BIN="$f" ;;
                  8.5*) PHP_BIN="$f" ;;
                  9.*) PHP_BIN="$f" ;;
                esac
                [ -n "$PHP_BIN" ] && break
              done
            fi

            if [ -z "$PHP_BIN" ]; then
              echo "ERROR: No PHP 8.2+ binary found on PATH or under /opt, /usr/local, or $HOME."
              echo "Available php-like commands on PATH:"
              compgen -c | grep -i '^php\|^lsphp' | sort -u || true
              exit 1
            fi
            echo "Using PHP binary: $PHP_BIN"
            "$PHP_BIN" -v

            COMPOSER_BIN="$(command -v composer)"
            "$PHP_BIN" "$COMPOSER_BIN" install --no-dev --optimize-autoloader
            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan route:cache
            "$PHP_BIN" artisan view:cache

            ln -sfn "$APP_DIR/backend/public" "$WEB_ROOT/api"
