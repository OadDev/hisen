name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            WEB_ROOT="${{ secrets.PUBLIC_HTML_PATH }}"

            if [ ! -d "$APP_DIR/.git" ]; then
            echo "ERROR: $APP_DIR is not a git checkout yet."
            echo "One-time setup: git clone <this-repo-url> \"$APP_DIR\""
            exit 1
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm run build

            rsync -a --delete --exclude ".htaccess" --exclude "api" dist/ "$WEB_ROOT/"

            if [ ! -f "$WEB_ROOT/.htaccess" ]; then
            write_htaccess() { cat > "$WEB_ROOT/.htaccess"; }
            write_htaccess <<'HTACCESS'
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_URI} ^/api [NC]
            RewriteRule ^ - [L]
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            RewriteRule ^ index.html [L]
            HTACCESS
            fi

            cd "$APP_DIR/backend"
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            ln -sfn "$APP_DIR/backend/public" "$WEB_ROOT/api"
